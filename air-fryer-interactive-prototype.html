<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Fryer Prototype</title>
<style>
  :root {
    --bg: #141414;
    --print: #cfd2d6;
    --pre: #1a7fe0;
    --cook: #f08a1c;
    --ready: #2fb344;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(ellipse at 50% 35%, #222 0%, var(--bg) 70%);
    color: #fff;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  #fryer {
    width: min(95vw, 800px);
    height: auto;
    max-height: 88vh;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  .edge  { stroke: #46474c; stroke-width: 1.5; stroke-linejoin: round; }
  .print { fill: none; stroke: var(--print); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }

  .knob { cursor: grab; outline: none; }
  .knob.dragging { cursor: grabbing; }
  .knob:focus-visible .knob-face { stroke: #6cf; stroke-width: 3; }
  .step-btn { cursor: pointer; }
  .step-btn:hover path { stroke: #9cf; }

  .btn { cursor: pointer; outline: none; transform-box: fill-box; transform-origin: center; transition: transform .08s; }
  .btn:hover .btn-bg { filter: brightness(1.12); }
  .btn:focus-visible .btn-bg { stroke: #6cf; stroke-width: 3; }
  .btn.pressed { transform: scale(.95); }

  .lcd-text   { fill: #e9f6ff; font-size: 28px; text-anchor: middle; }
  .status     { fill: #46525a; font-size: 17px; text-anchor: middle; transition: fill .2s; }
  .status.on  { fill: #fff; }
  .hl         { opacity: 0; transition: opacity .2s; }
  .hl.on      { opacity: 1; }
  #hl-pre     { fill: var(--pre); }
  #hl-cook    { fill: var(--cook); }
  #hl-ready   { fill: var(--ready); }

  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .15; } }

  #lcd-frame.error { stroke: #ff4d4d; }

  .demo {
    display: flex;
    gap: 18px;
    align-items: center;
    font-size: 14px;
    color: #aaa;
    flex-wrap: wrap;
    justify-content: center;
  }
  .demo select {
    background: #222;
    color: #fff;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 2px 6px;
  }
  .demo b { color: #fff; font-weight: 600; }
</style>
</head>
<body>

<svg id="fryer" viewBox="0 0 800 780" xmlns="http://www.w3.org/2000/svg" aria-label="Air fryer">
  <defs>
    <!-- Body finishes -->
    <linearGradient id="g-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4b50"/>
      <stop offset="1" stop-color="#2b2c30"/>
    </linearGradient>
    <linearGradient id="g-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#161719"/>
      <stop offset="1" stop-color="#26272b"/>
    </linearGradient>
    <linearGradient id="g-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25262a"/>
      <stop offset="1" stop-color="#101113"/>
    </linearGradient>
    <linearGradient id="g-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202125"/>
      <stop offset="1" stop-color="#141517"/>
    </linearGradient>

    <!-- Brushed steel -->
    <radialGradient id="g-steel" cx="40%" cy="35%" r="70%">
      <stop offset="0"   stop-color="#fafafa"/>
      <stop offset=".45" stop-color="#d4d5d8"/>
      <stop offset=".85" stop-color="#9a9ca0"/>
      <stop offset="1"   stop-color="#6e7074"/>
    </radialGradient>
    <linearGradient id="g-steel-strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#7c7e82"/>
      <stop offset=".3"  stop-color="#e8e9eb"/>
      <stop offset=".55" stop-color="#a2a4a8"/>
      <stop offset=".8"  stop-color="#d0d2d5"/>
      <stop offset="1"   stop-color="#7c7e82"/>
    </linearGradient>

    <!-- Handle -->
    <linearGradient id="g-handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"  stop-color="#2a2b2f"/>
      <stop offset=".4" stop-color="#3c3d42"/>
      <stop offset="1"  stop-color="#1c1d20"/>
    </linearGradient>

    <!-- Buttons -->
    <linearGradient id="g-start" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"  stop-color="#6cc23a"/>
      <stop offset=".5" stop-color="#3d7f17"/>
      <stop offset="1"  stop-color="#2d6410"/>
    </linearGradient>
    <linearGradient id="g-stop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"  stop-color="#ff7b6b"/>
      <stop offset=".5" stop-color="#d9483a"/>
      <stop offset="1"  stop-color="#b3352a"/>
    </linearGradient>

    <!-- Window interior -->
    <pattern id="mesh" patternUnits="userSpaceOnUse" width="14" height="14">
      <rect width="14" height="14" fill="#141416"/>
      <circle cx="7" cy="7" r="3.2" fill="#050506"/>
    </pattern>
    <radialGradient id="g-heat" cx="50%" cy="55%" r="65%">
      <stop offset="0"   stop-color="#ffb347"/>
      <stop offset=".6"  stop-color="#ff6a00"/>
      <stop offset="1"   stop-color="#7a1a00"/>
    </radialGradient>
    <linearGradient id="g-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".02"/>
      <stop offset="1"   stop-color="#000" stop-opacity=".25"/>
    </linearGradient>
    <clipPath id="clip-window">
      <rect x="193" y="380" width="522" height="320" rx="40"/>
    </clipPath>

    <filter id="f-glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".6"/>
    </filter>
    <filter id="f-floor" x="-10%" y="-200%" width="120%" height="500%">

    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd2d6"/>
    </marker>
  </defs>

  <!-- Floor shadow + feet -->
  <ellipse cx="420" cy="758" rx="370" ry="14" fill="#000" opacity=".7" filter="url(#f-floor)"/>
  <rect x="180" y="746" width="54" height="12" rx="3" fill="#0a0a0b"/>
  <rect x="676" y="746" width="54" height="12" rx="3" fill="#0a0a0b"/>
  <polygon points="62,655 92,684 92,694 62,665" fill="#0a0a0b"/>

  <!-- Body -->
  <polygon class="edge" fill="url(#g-top)"  points="48,38 665,38 762,135 147,135"/>
  <polygon class="edge" fill="url(#g-side)" points="48,38 147,135 147,750 48,652"/>
  <polyline fill="none" stroke="#0b0b0c" stroke-width="2.5" points="147,305 97,258 97,700"/>
  <polyline fill="none" stroke="#3a3b40" stroke-width="1" points="147,308 99,262 99,700"/>
  <rect class="edge" fill="url(#g-front)" x="147" y="135" width="615" height="615"/>
  <rect fill="url(#g-panel)" x="148" y="136" width="613" height="171"/>
  <rect fill="url(#g-gloss)" x="148" y="136" width="613" height="171"/>
  <line x1="148" y1="307" x2="761" y2="307" stroke="#060607" stroke-width="3"/>
  <line x1="148" y1="309.5" x2="761" y2="309.5" stroke="#3a3b40" stroke-width="1"/>

  <!-- Basket window -->
  <g clip-path="url(#clip-window)">
    <rect x="193" y="380" width="522" height="320" fill="url(#mesh)"/>
    <rect id="heat-glow" x="193" y="380" width="522" height="320" fill="url(#g-heat)" opacity="0"/>
    <rect x="193" y="380" width="522" height="320" fill="#000" opacity=".35"/>
    <rect x="193" y="380" width="522" height="320" fill="url(#g-glass)"/>
    <polygon points="250,380 330,380 200,640 193,640 193,500" fill="#fff" opacity=".05"/>
  </g>
  <rect x="193" y="380" width="522" height="320" rx="40" fill="none" stroke="#0a0a0b" stroke-width="7"/>
  <rect x="189" y="376" width="530" height="328" rx="44" fill="none" stroke="#3a3b40" stroke-width="1"/>

  <!-- Handle -->
  <g filter="url(#f-shadow)">
    <polygon class="edge" fill="#2a2b2f" points="393,308 488,308 515,333 418,333"/>
    <polygon class="edge" fill="#18191c" points="393,308 418,333 418,402 393,380"/>
    <polygon class="edge" fill="#3a3b40" points="418,333 515,333 540,357 442,357"/>
    <polygon class="edge" fill="#1b1c1f" points="418,333 442,357 442,628 418,605"/>
    <rect    class="edge" fill="url(#g-handle)" x="442" y="357" width="98" height="271"/>
    <rect x="472" y="385" width="38" height="215" rx="5" fill="url(#g-steel-strip)" stroke="#55575c" stroke-width="1"/>
  </g>

  <!-- Time knob -->
  <g class="print">
    <circle cx="249" cy="152" r="10"/>
    <polyline points="249,145 249,153 244,153"/>
  </g>
  <path class="print" d="M 189 250 A 62 62 0 1 1 309 250" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <g class="step-btn" data-knob="time" data-dir="-1" role="button" aria-label="Decrease time">
    <circle cx="178" cy="268" r="14" fill="transparent"/>
    <path class="print" d="M171 268 H185" stroke-width="3.2"/>
  </g>
  <g class="step-btn" data-knob="time" data-dir="1" role="button" aria-label="Increase time">
    <circle cx="320" cy="268" r="14" fill="transparent"/>
    <path class="print" d="M313 268 H327 M320 261 V275" stroke-width="3.2"/>
  </g>
  <g id="knob-time" class="knob" tabindex="0" role="slider" aria-label="Time knob" data-cx="249" data-cy="235">
    <circle cx="249" cy="235" r="52" fill="#08080a" stroke="#3a3b40" stroke-width="1.5"/>
    <circle class="knob-face" cx="249" cy="235" r="47" fill="url(#g-steel)" stroke="#5c5e62" stroke-width="1.5" filter="url(#f-shadow)"/>
    <g class="knob-rot">
      <circle cx="249" cy="235" r="44.5" fill="none" stroke="#7d7f83" stroke-width="3" stroke-dasharray="1.6 3"/>
      <line x1="249" y1="226" x2="249" y2="196" stroke="#1b1c1f" stroke-width="4.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Temperature knob -->
  <g class="print">
    <line x1="667" y1="141" x2="667" y2="152"/>
    <circle cx="667" cy="157" r="5"/>
  </g>
  <path class="print" d="M 607 250 A 62 62 0 1 1 727 250" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <g class="step-btn" data-knob="temp" data-dir="-1" role="button" aria-label="Decrease temperature">
    <circle cx="596" cy="268" r="14" fill="transparent"/>
    <path class="print" d="M589 268 H603" stroke-width="3.2"/>
  </g>
  <g class="step-btn" data-knob="temp" data-dir="1" role="button" aria-label="Increase temperature">
    <circle cx="738" cy="268" r="14" fill="transparent"/>
    <path class="print" d="M731 268 H745 M738 261 V275" stroke-width="3.2"/>
  </g>
  <g id="knob-temp" class="knob" tabindex="0" role="slider" aria-label="Temperature knob" data-cx="667" data-cy="235">
    <circle cx="667" cy="235" r="52" fill="#08080a" stroke="#3a3b40" stroke-width="1.5"/>
    <circle class="knob-face" cx="667" cy="235" r="47" fill="url(#g-steel)" stroke="#5c5e62" stroke-width="1.5" filter="url(#f-shadow)"/>
    <g class="knob-rot">
      <circle cx="667" cy="235" r="44.5" fill="none" stroke="#7d7f83" stroke-width="3" stroke-dasharray="1.6 3"/>
      <line x1="667" y1="226" x2="667" y2="196" stroke="#1b1c1f" stroke-width="4.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Display -->
  <rect id="lcd-frame" x="343" y="160" width="222" height="72" rx="10" fill="#05080a" stroke="#2b3238" stroke-width="2"/>
  <line x1="455" y1="164" x2="455" y2="204" stroke="#2f3c45" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="347" y1="206" x2="561" y2="206" stroke="#2f3c45" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text id="time-text" class="lcd-text" x="397" y="195" filter="url(#f-glow)">8:30</text>
  <text id="temp-text" class="lcd-text" x="512" y="195" filter="url(#f-glow)">350°</text>

  <rect id="hl-pre"   class="hl" x="374" y="208" width="36" height="21" rx="3"/>
  <rect id="hl-cook"  class="hl" x="429" y="208" width="48" height="21" rx="3"/>
  <rect id="hl-ready" class="hl" x="490" y="208" width="54" height="21" rx="3"/>
  <text id="st-pre"   class="status" x="392" y="224">Pre</text>
  <text id="st-cook"  class="status" x="453" y="224">Cook</text>
  <text id="st-ready" class="status" x="517" y="224">Ready</text>

  <!-- Start / Pause -->
  <g id="btn-start" class="btn" tabindex="0" role="button" aria-label="Start or pause">
    <rect class="btn-bg" x="343" y="246" width="98" height="50" rx="7" fill="url(#g-start)" stroke="#1f4a0a" stroke-width="1.5" filter="url(#f-shadow)"/>
    <rect x="346" y="248" width="92" height="20" rx="6" fill="#fff" opacity=".14"/>
    <g fill="#fff" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="358,258 358,284 381,271"/>
      <line x1="391" y1="287" x2="402" y2="255"/>
      <rect x="408" y="258" width="8" height="26" rx="1"/>
      <rect x="422" y="258" width="8" height="26" rx="1"/>
    </g>
  </g>

  <!-- Stop -->
  <g id="btn-stop" class="btn" tabindex="0" role="button" aria-label="Stop">
    <rect class="btn-bg" x="466" y="246" width="99" height="50" rx="7" fill="url(#g-stop)" stroke="#7a2019" stroke-width="1.5" filter="url(#f-shadow)"/>
    <rect x="469" y="248" width="93" height="20" rx="6" fill="#fff" opacity=".14"/>
    <rect x="504" y="259" width="24" height="24" rx="2" fill="#fff"/>
  </g>
</svg>

<div style="width: 50px;">
  <b style="visibility: hidden;" id="current-temp">70°</b>
</div>
<div class="demo">
  <!--<span>Drag, scroll, or use arrow keys on the knobs</span>
  <span>Internal temp: <b id="current-temp">70°</b></span>-->
  <label><span style="font-weight: bold; text-decoration: underline;">Demo speed</span>
    <select id="speed">
      <option value="1">1×</option>
      <option value="5">5×</option>
      <option value="20">20×</option>
      <option value="60">60×</option>
    </select>
  </label>
</div>

<script>
(() => {
  const MAX_TIME = 60 * 60;   // seconds
  const MAX_TEMP = 400;       // °F
  const TIME_STEP = 30;       // seconds per knob detent
  const TEMP_STEP = 5;        // degrees per knob detent
  const DETENT = 12;          // degrees of knob rotation per step
  const AMBIENT = 70;
  const HEAT_RATE = 6;        // °F per second
  const COOL_RATE = 1.5;      // °F per second
  const REHEAT_MARGIN = 15;   // drop below target that sends Cook back to Pre

  const state = {
    time: 8 * 60 + 30,
    temp: 350,
    current: AMBIENT,
    phase: 'idle',            // idle | pre | cook | ready
    running: false,
    setTime: 8 * 60 + 30,
  };

  const $ = id => document.getElementById(id);
  const el = {
    time: $('time-text'), temp: $('temp-text'), frame: $('lcd-frame'),
    glow: $('heat-glow'), current: $('current-temp'), speed: $('speed'),
    knobTime: $('knob-time'), knobTemp: $('knob-temp'),
  };

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const fmtTime = s => { s = Math.ceil(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

  // ---------- Sound ----------
  let ac, master, noiseBuf, hum = null;

  function audio() {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain();
      master.gain.value = 0.8;
      master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }

  function noise() {
    if (!noiseBuf) {
      const a = audio();
      noiseBuf = a.createBuffer(1, a.sampleRate * 2, a.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
  }

  // Piezo buzzer: square wave through a resonant band-pass gives the thin, sharp appliance tone.
  function beep(dur = 0.09, delay = 0, freq = 2730, vol = 0.14) {
    try {
      const a = audio(), t = a.currentTime + delay + 0.005;
      const o = a.createOscillator();
      o.type = 'square';
      o.frequency.value = freq;
      const bp = a.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = freq;
      bp.Q.value = 5;
      const g = a.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.003);
      g.gain.setValueAtTime(vol, t + dur - 0.006);
      g.gain.linearRampToValueAtTime(0, t + dur);
      o.connect(bp).connect(g).connect(master);
      o.start(t);
      o.stop(t + dur + 0.02);
    } catch { /* audio unavailable */ }
  }
  const beeps = (n, gap = 0.16, dur = 0.09, delay = 0) => { for (let i = 0; i < n; i++) beep(dur, delay + i * gap); };

  // Mechanical detent tick for the knobs
  function detentClick() {
    try {
      const a = audio(), t = a.currentTime;
      const s = a.createBufferSource();
      s.buffer = noise();
      const f = a.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = 3200;
      f.Q.value = 2;
      const g = a.createGain();
      g.gain.setValueAtTime(0.5, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.012);
      s.connect(f).connect(g).connect(master);
      s.start(t, Math.random() * 1.5);
      s.stop(t + 0.02);
    } catch { /* audio unavailable */ }
  }

  // Fan motor hum: airflow noise + low motor tone + blade whir, with spin-up/spin-down ramps.
  function setHum(on) {
    if (on === !!hum) return;
    let a;
    try { a = audio(); } catch { return; }
    const t = a.currentTime;

    if (!on) {
      const h = hum;
      hum = null;
      const SPIN_DOWN = 2.2;
      h.out.gain.cancelScheduledValues(t);
      h.out.gain.setValueAtTime(h.out.gain.value, t);
      h.out.gain.linearRampToValueAtTime(0, t + SPIN_DOWN);
      h.motor.frequency.setTargetAtTime(35, t, SPIN_DOWN / 3);
      h.whir.frequency.setTargetAtTime(70, t, SPIN_DOWN / 3);
      h.air.frequency.setTargetAtTime(250, t, SPIN_DOWN / 3);
      h.sources.forEach(s => s.stop(t + SPIN_DOWN + 0.1));
      return;
    }

    const out = a.createGain();
    out.gain.setValueAtTime(0, t);
    out.gain.linearRampToValueAtTime(0.35, t + 1.5);
    out.connect(master);

    const n = a.createBufferSource();
    n.buffer = noise();
    n.loop = true;
    const air = a.createBiquadFilter();
    air.type = 'lowpass';
    air.Q.value = 0.8;
    air.frequency.setValueAtTime(250, t);
    air.frequency.linearRampToValueAtTime(950, t + 1.5);
    const airGain = a.createGain();
    airGain.gain.value = 0.45;
    n.connect(air).connect(airGain).connect(out);

    const motor = a.createOscillator();
    motor.type = 'sawtooth';
    motor.frequency.setValueAtTime(35, t);
    motor.frequency.linearRampToValueAtTime(120, t + 1.5);
    const motorLp = a.createBiquadFilter();
    motorLp.type = 'lowpass';
    motorLp.frequency.value = 380;
    const motorGain = a.createGain();
    motorGain.gain.value = 0.07;
    motor.connect(motorLp).connect(motorGain).connect(out);

    const whir = a.createOscillator();
    whir.type = 'triangle';
    whir.frequency.setValueAtTime(70, t);
    whir.frequency.linearRampToValueAtTime(235, t + 1.5);
    const whirGain = a.createGain();
    whirGain.gain.value = 0.025;
    whir.connect(whirGain).connect(out);

    const lfo = a.createOscillator();
    lfo.frequency.value = 0.6;
    const lfoGain = a.createGain();
    lfoGain.gain.value = 70;
    lfo.connect(lfoGain).connect(air.frequency);

    const sources = [n, motor, whir, lfo];
    sources.forEach(s => s.start(t));
    hum = { out, air, motor, whir, sources };
  }

  // ---------- Controls ----------
  function adjustTime(dir) {
    if (state.phase === 'ready') state.phase = 'idle';
    const before = state.time;
    state.time = clamp(Math.ceil(state.time) + dir * TIME_STEP, 0, MAX_TIME);
    if (state.time !== before) detentClick();
    if (state.phase === 'idle') state.setTime = state.time;
    if (state.time === 0 && (state.phase === 'pre' || state.phase === 'cook')) finish();
    render();
  }

  function adjustTemp(dir) {
    const before = state.temp;
    state.temp = clamp(state.temp + dir * TEMP_STEP, 0, MAX_TEMP);
    if (state.temp !== before) detentClick();
    if (state.running && state.phase === 'cook' && state.current < state.temp - REHEAT_MARGIN) state.phase = 'pre';
    render();
  }

  function toggleStart() {
    if (state.phase === 'idle' || state.phase === 'ready') {
      if (state.time <= 0 || state.temp <= 0) return showError();
      state.setTime = state.time;
      state.running = true;
      state.phase = state.current >= state.temp ? 'cook' : 'pre';
    } else {
      state.running = !state.running;
      if (state.running && state.phase === 'cook' && state.current < state.temp - REHEAT_MARGIN) state.phase = 'pre';
    }
    beep();
    render();
  }

  function stop() {
    if (state.phase !== 'idle') state.time = state.setTime;
    state.phase = 'idle';
    state.running = false;
    beeps(2, 0.13, 0.07);
    render();
  }

  function finish() {
    state.time = 0;
    state.phase = 'ready';
    state.running = false;
    for (let k = 0; k < 3; k++) beeps(3, 0.17, 0.1, k * 1.0);
  }

  function showError() {
    el.frame.classList.add('error');
    beep(0.4, 0, 2050, 0.12);
    setTimeout(() => el.frame.classList.remove('error'), 400);
  }

  // ---------- Knobs (free, unlimited rotation) ----------
  function makeKnob(knob, onStep) {
    const rot = knob.querySelector('.knob-rot');
    const face = knob.querySelector('.knob-face');
    const { cx, cy } = knob.dataset;
    let angle = 0, acc = 0, lastA = null;

    const draw = () => rot.setAttribute('transform', `rotate(${angle} ${cx} ${cy})`);
    const pointerAngle = e => {
      const r = face.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      return { a: Math.atan2(dy, dx) * 180 / Math.PI, dist: Math.hypot(dx, dy) };
    };
    function rotate(d) {
      angle += d; acc += d;
      while (acc >= DETENT)  { acc -= DETENT; onStep(1); }
      while (acc <= -DETENT) { acc += DETENT; onStep(-1); }
      draw();
    }

    knob.addEventListener('pointerdown', e => {
      knob.setPointerCapture(e.pointerId);
      knob.classList.add('dragging');
      lastA = pointerAngle(e).a;
      knob.focus();
      e.preventDefault();
    });
    knob.addEventListener('pointermove', e => {
      if (lastA === null) return;
      const { a, dist } = pointerAngle(e);
      if (dist < 6) return; // angle is unstable near the center
      let d = a - lastA;
      if (d > 180) d -= 360;
      if (d < -180) d += 360;
      lastA = a;
      rotate(d);
    });
    const end = () => { lastA = null; knob.classList.remove('dragging'); };
    knob.addEventListener('pointerup', end);
    knob.addEventListener('pointercancel', end);
    knob.addEventListener('wheel', e => { e.preventDefault(); rotate(e.deltaY < 0 ? DETENT : -DETENT); }, { passive: false });
    knob.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { rotate(DETENT); e.preventDefault(); }
      if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { rotate(-DETENT); e.preventDefault(); }
    });
    return { rotate };
  }

  const knobs = {
    time: makeKnob(el.knobTime, adjustTime),
    temp: makeKnob(el.knobTemp, adjustTemp),
  };

  document.querySelectorAll('.step-btn').forEach(b =>
    b.addEventListener('click', () => knobs[b.dataset.knob].rotate(DETENT * Number(b.dataset.dir))));

  function wireButton(btn, action) {
    const press = () => {
      btn.classList.add('pressed');
      setTimeout(() => btn.classList.remove('pressed'), 120);
      action();
    };
    btn.addEventListener('click', press);
    btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); press(); } });
  }
  wireButton($('btn-start'), toggleStart);
  wireButton($('btn-stop'), stop);

  // ---------- Render ----------
  function render() {
    el.time.textContent = fmtTime(state.time);
    el.temp.textContent = `${state.temp}°`;

    const paused = !state.running && (state.phase === 'pre' || state.phase === 'cook');
    el.time.classList.toggle('blink', paused);

    for (const p of ['pre', 'cook', 'ready']) {
      const on = state.phase === p;
      for (const node of [$('hl-' + p), $('st-' + p)]) {
        node.classList.toggle('on', on);
        node.classList.toggle('blink', on && paused);
      }
    }

    el.knobTime.setAttribute('aria-valuetext', fmtTime(state.time));
    el.knobTemp.setAttribute('aria-valuetext', `${state.temp} degrees`);

    setHum(state.running);
  }

  // ---------- Simulation loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.25);
    last = now;
    const s = dt * Number(el.speed.value);

    const heating = state.running && (state.phase === 'pre' || state.phase === 'cook');
    const goal = heating ? Math.max(state.temp, AMBIENT) : AMBIENT;
    if (state.current < goal) state.current = Math.min(goal, state.current + HEAT_RATE * s);
    else state.current = Math.max(goal, state.current - COOL_RATE * s);

    let changed = false;
    if (state.running && state.phase === 'pre' && state.current >= state.temp) {
      state.phase = 'cook';
      beeps(2, 0.15);
      changed = true;
    }
    if (state.running && state.phase === 'cook') {
      const prev = Math.ceil(state.time);
      state.time = Math.max(0, state.time - s);
      if (state.time <= 0) { finish(); changed = true; }
      else if (Math.ceil(state.time) !== prev) changed = true;
    }
    if (changed) render();

    // Interior: warm light while running, glow intensifies with heat and flickers slightly
    const heat = clamp((state.current - AMBIENT) / (MAX_TEMP - AMBIENT), 0, 1);
    const flicker = heating ? 0.03 * Math.sin(now / 90) * Math.sin(now / 37) : 0;
    el.glow.setAttribute('opacity', clamp((heating ? 0.12 : 0) + heat * 0.6 + flicker, 0, 1).toFixed(3));
    el.current.textContent = `${Math.round(state.current)}°`;

    requestAnimationFrame(loop);
  }

  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
